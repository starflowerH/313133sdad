<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>效期管家 · 预览</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Ma+Shan+Zheng&display=swap" rel="stylesheet" />
<style>
  :root{
    --paper:#FAFAF8; --surface:#FFFFFF; --line:#ECECEC; --line-soft:#F2F2EE;
    --ink:#0A0A0A; --ink-soft:#8C8C88; --ink-mute:#B6B6B2;
    --accent:#4A5568; --accent-soft:#EEF1F6;
    --r:18px; --r-lg:22px; --r-xl:28px;
    --green:#3FA86A; --orange:#E08A3C; --red:#D9534F; --blue:#5B7FB0; --gray:#A8A8A4;
    --shadow:0 1px 2px rgba(0,0,0,.04);
    --shadow-soft:0 6px 18px rgba(0,0,0,.05);
  }
  body.dark{
    --paper:#121212; --surface:#1C1C1C; --line:#2A2A2A; --line-soft:#232323;
    --ink:#ECECEC; --ink-soft:#8A8A86; --ink-mute:#5A5A58;
    --accent:#AEB8C8; --accent-soft:#2A2F38;
    --shadow:none; --shadow-soft:none;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:#e9e9e6;font-family:'Noto Sans SC',"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;justify-content:center;min-height:100vh;padding:24px 12px;color:var(--ink);}
  body.dark{background:#000;}
  /* 主题背景（3 套预设渐变 + 自定义图片），由个性化页选择 */
  body.bg-cream{--bg-img:linear-gradient(180deg,#FFE2BD 0%,#FFF1DA 45%,#FFFBEF 100%);}
  body.bg-dream{--bg-img:linear-gradient(180deg,#D9CDF3 0%,#B5A6D6 35%,#7B6FA1 100%);}
  body.bg-cloud{--bg-img:linear-gradient(180deg,#D9E8F3 0%,#EAF1F7 40%,#FBF8F5 100%);}
  body.bg-custom{--bg-img:var(--bg-img-custom, #FFF8EC);}
  body:not(.bg-cream):not(.bg-dream):not(.bg-cloud):not(.bg-custom){--bg-img:none;}
  .phone::before{content:'';position:absolute;inset:0;background:var(--bg-img);background-size:cover;background-position:center;pointer-events:none;z-index:0;transition:background .3s;}
  .phone::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0) 55%,rgba(255,255,255,.55) 100%);pointer-events:none;z-index:0;}
  body.dark .phone::after{background:linear-gradient(180deg,rgba(0,0,0,0) 55%,rgba(0,0,0,.35) 100%);}
  .phone>*{position:relative;z-index:1;}
  /* 手机外框 */
  .phone{width:390px;max-width:100%;height:844px;max-height:92vh;background:var(--paper);
    border-radius:40px;overflow:hidden;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.18);
    display:flex;flex-direction:column;border:1px solid var(--line);}
  .tophead{display:flex;align-items:flex-end;justify-content:space-between;padding:24px 18px 8px;}
  .top-left{display:flex;align-items:flex-end;gap:14px;}
  .hand-title{font-family:'Ma Shan Zheng',cursive;font-size:32px;line-height:1.1;color:var(--ink);letter-spacing:1px;}
  .icon-btn{width:38px;height:38px;border:none;background:transparent;border-radius:50%;
    color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s;}
  .icon-btn:hover{background:var(--line-soft);color:var(--ink);}
  .icon-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
  /* 合并菜单 */
  .dropdown{position:absolute;top:62px;right:14px;background:var(--surface);border:1px solid var(--line);
    border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:6px;z-index:30;min-width:184px;display:none;}
  body.dark .dropdown{box-shadow:0 8px 24px rgba(0,0,0,.5);}
  .dropdown.show{display:block;}
  .dropdown button{display:flex;width:100%;align-items:center;gap:10px;padding:10px 12px;border:none;
    background:transparent;color:var(--ink);font-size:14px;border-radius:10px;cursor:pointer;font-family:inherit;text-align:left;}
  .dropdown button:hover{background:var(--line);}
  .dropdown .sep{height:1px;background:var(--line);margin:4px 6px;}
  .dropdown .ck{margin-left:auto;color:var(--accent);font-size:12px;}
  /* 分类胶囊 */
  .chips{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 6px;scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto;padding:9px 16px;border-radius:20px;border:1px solid var(--line);
    background:var(--surface);color:var(--ink-soft);font-size:14px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;transition:all .2s;}
  .chip:hover{border-color:var(--ink-mute);}
  .chip.active{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:600;}
  body.dark .chip.active{color:var(--ink);}
  /* 搜索 */
  .search{margin:6px 16px 8px;display:flex;align-items:center;gap:8px;background:var(--surface);
    border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;color:var(--ink-soft);}
  .search input{border:none;outline:none;background:transparent;flex:1;font-size:15px;color:var(--ink);font-family:inherit;}
  /* 内容 */
  .content{flex:1;overflow-y:auto;padding:8px 16px 110px;scrollbar-width:none;}
  .content::-webkit-scrollbar{display:none;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
    padding:14px 16px;margin-bottom:10px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);cursor:pointer;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s;}
  .card:hover{box-shadow:var(--shadow-soft);}
  .card.handled{opacity:.55;}
  .card::before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--gray);}
  .card[data-state="red"]::before{background:var(--red);}
  .card[data-state="orange"]::before{background:var(--orange);}
  .card[data-state="green"]::before{background:var(--green);}
  .card[data-state="handled"]::before{background:var(--gray);opacity:.5;}
  .avatar{width:46px;height:46px;border-radius:14px;object-fit:cover;background:var(--line-soft);
    display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--ink-soft);flex:0 0 auto;}
  .info{flex:1;min-width:0;}
  .name{font-size:16px;font-weight:600;margin:0 0 4px;display:flex;align-items:center;gap:8px;}
  .meta{font-size:12.5px;color:var(--ink-soft);display:flex;align-items:center;gap:8px;}
  .meta .dot{width:3px;height:3px;border-radius:50%;background:var(--ink-mute);}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .grid .card{flex-direction:column;align-items:flex-start;}
  .grid .avatar{width:100%;height:86px;border-radius:14px;}
  .badge{font-size:11px;padding:3px 9px;border-radius:20px;color:#fff;font-weight:600;letter-spacing:.2px;display:inline-flex;align-items:center;gap:3px;}
  .b-green{background:var(--green);} .b-orange{background:var(--orange);}
  .b-red{background:var(--red);} .b-blue{background:var(--blue);} .b-gray{background:var(--gray);}
  /* 今日概览卡片 */
  .overview{background:linear-gradient(135deg,var(--accent-soft) 0%,transparent 100%);border:1px solid var(--line);border-radius:var(--r-xl);padding:16px 16px 14px;margin-bottom:12px;display:flex;flex-direction:column;align-items:center;gap:12px;}
  .overview .greet h2{margin:0;font-size:16px;font-weight:600;color:var(--ink);letter-spacing:2px;text-align:center;}
  .overview .pill{background:rgba(255,255,255,.6);backdrop-filter:blur(8px);border-radius:12px;padding:4px 12px;font-size:11px;color:var(--ink-soft);font-weight:500;letter-spacing:.5px;}
  .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;width:100%;}
  .stat{background:var(--surface);border-radius:12px;padding:8px 4px;text-align:center;box-shadow:var(--shadow);}
  .stat .num{font-size:20px;font-weight:700;line-height:1;letter-spacing:-.5px;}
  .stat .num.red{color:var(--red);}
  .stat .num.orange{color:var(--orange);}
  .stat .num.green{color:var(--green);}
  .stat .lbl{font-size:10.5px;color:var(--ink-soft);margin-top:3px;letter-spacing:.3px;}
  /* 中间 + 按钮：accent 主题色 */
  .nav-add{flex:0 0 auto;width:50px;height:50px;border-radius:16px;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;
    box-shadow:0 4px 14px rgba(74,85,104,.3);transition:transform .15s;margin:0 6px;}
  .nav-add:active{transform:scale(.92);}
  .nav-add svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;}
  body.dark .nav-add{background:#fff;color:#000;box-shadow:0 4px 14px rgba(255,255,255,.18);}
  /* 底部导航 */
  .nav{position:absolute;left:0;right:0;bottom:0;height:80px;background:var(--surface);
    border-top:1px solid var(--line);display:flex;align-items:center;padding:0 8px;gap:2px;}
  .nav .nav-btn{flex:1;border:none;background:transparent;color:var(--ink-soft);
    font-size:11px;border-radius:18px;padding:8px 0 6px;cursor:pointer;font-family:inherit;
    display:flex;flex-direction:column;align-items:center;gap:4px;transition:color .2s,background .2s;
    height:60px;justify-content:center;}
  .nav .nav-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:width .15s,height .15s;}
  .nav .nav-btn.active{color:var(--accent);font-weight:600;}
  .nav .nav-btn.active svg{width:24px;height:24px;}
  .nav .nav-btn.active::after{content:'';display:block;width:4px;height:4px;border-radius:50%;background:var(--accent);margin-top:2px;}
  /* 我的页 */
  .me-page{background:#F5F5F5;min-height:100%;padding:0 0 24px;}
  .me-info{background:#fff;padding:18px 20px;display:flex;align-items:center;gap:14px;cursor:pointer;position:relative;transition:background .2s;}
  .me-info:active{background:#FAFAFA;}
  .me-info::after{content:'';position:absolute;left:20px;right:20px;bottom:0;height:1px;background:var(--line);}
  .me-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#F8F8F4,#ECECEC);display:flex;align-items:center;justify-content:center;color:var(--ink-soft);flex:0 0 auto;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.04);}
  .me-avatar svg{width:50%;height:50%;stroke:var(--ink-soft);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;}
  .me-avatar img{width:100%;height:100%;object-fit:cover;}
  .me-meta{flex:1;min-width:0;}
  .me-name{font-size:17px;color:var(--ink);font-weight:600;line-height:1.2;letter-spacing:.2px;}
  .me-phone{font-size:13px;color:var(--ink-mute);margin-top:3px;}
  .me-edit{color:var(--ink-mute);pointer-events:none;}
  .me-edit svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
  .me-group{background:#fff;}
  .me-row{display:flex;align-items:center;gap:14px;padding:0 20px;height:56px;cursor:pointer;border-bottom:1px solid var(--line-soft);transition:background .15s;}
  .me-row:last-child{border-bottom:none;}
  .me-row:active{background:#E8F0FE;}
  .me-row .ic{width:24px;height:24px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);flex:0 0 auto;}
  .me-row .ic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
  .me-row .t{font-size:15.5px;color:var(--ink);flex:1;font-weight:500;}
  .me-row .chev{color:var(--ink-mute);}
  .me-row .chev svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
  .me-row.danger .t{color:#FF3B30;}
  .me-row.danger .ic svg{stroke:#FF3B30;}
  .me-gap{height:8px;background:#F5F5F5;}
  /* 子页面弹层 */
  .subpage-mask{position:absolute;inset:0;background:rgba(0,0,0,.32);opacity:0;pointer-events:none;transition:.25s;z-index:14;}
  .subpage-mask.show{opacity:1;pointer-events:auto;}
  .subpage{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:40px 40px 0 0;transform:translateY(100%);transition:.3s cubic-bezier(.2,.8,.2,1);padding:14px 18px 30px;z-index:15;max-height:98%;overflow-y:auto;scroll-behavior:smooth;border-top:1px solid var(--line);overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}
  .subpage.show{transform:translateY(0);}
  .subpage::-webkit-scrollbar{width:4px;}
  .subpage::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
  .subpage::-webkit-scrollbar-track{background:transparent;}
  .subpage h3{margin:6px 0 14px;font-size:18px;font-weight:600;display:flex;align-items:center;justify-content:space-between;}
  .subpage .back{background:none;border:none;color:var(--ink-soft);font-size:14px;cursor:pointer;font-family:inherit;}
  .subpage .label{font-size:13px;color:var(--ink-soft);margin:13px 4px 7px;letter-spacing:.3px;}
  .subpage .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:8px;}
  .subpage .center{display:flex;flex-direction:column;align-items:center;padding:24px 18px;}
  .subpage .big-avatar{width:88px;height:88px;border-radius:50%;background:#F5F5F5;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid var(--line);}
  .subpage .big-avatar svg{width:50%;height:50%;stroke:var(--ink-soft);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;}
  .subpage .big-avatar img{width:100%;height:100%;object-fit:cover;}
  .subpage .btn-blue{background:var(--accent);color:#fff;border:none;padding:11px 18px;border-radius:12px;font-size:14px;cursor:pointer;font-family:inherit;margin-top:10px;font-weight:500;transition:opacity .2s;}
  .subpage .btn-blue:active{opacity:.8;}
  .subpage .field-row{display:flex;align-items:center;gap:10px;padding:14px;background:#fff;border:1px solid var(--line);border-radius:18px;margin-bottom:8px;}
  .subpage .field-row .ic{color:#666;display:flex;}
  .subpage .field-row .ic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
  .subpage .field-row input{flex:1;border:none;outline:none;font-size:15px;font-family:inherit;color:var(--ink);background:transparent;}
  .subpage .field-row .pill{background:none;border:none;color:var(--accent);font-size:13px;cursor:pointer;font-family:inherit;font-weight:500;}
  .acc-item{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;border-top:1px solid var(--line);min-height:48px;}
  .acc-item .ic{width:28px;height:28px;border-radius:8px;background:var(--line-soft);display:flex;align-items:center;justify-content:center;color:var(--ink-soft);flex:0 0 auto;}
  .acc-item .ic svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
  .acc-item .t{font-size:15px;color:var(--ink);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.2px;}
  .acc-item .s{font-size:13px;color:var(--ink-mute);font-variant-numeric:tabular-nums;}
  .switch{width:42px;height:24px;border-radius:12px;background:var(--line);position:relative;cursor:pointer;transition:background .2s;flex:0 0 auto;}
  .switch.on{background:var(--accent);}
  .switch .knob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;}
  .switch.on .knob{left:20px;}
  /* 锁屏 */
  .lock-screen{position:absolute;inset:0;background:var(--paper);z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;padding:0 40px;}
  .lock-screen.show{display:flex;}
  .lock-screen .lk-avatar{width:80px;height:80px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;border:1px solid var(--line);margin-bottom:16px;overflow:hidden;}
  .lock-screen .lk-avatar svg{width:50%;height:50%;stroke:var(--ink-soft);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;}
  .lock-screen .lk-avatar img{width:100%;height:100%;object-fit:cover;}
  .lock-screen h3{margin:0 0 4px;font-size:18px;}
  .lock-screen .hint2{font-size:13px;color:var(--ink-soft);margin-bottom:24px;text-align:center;}
  .lock-screen input{width:100%;max-width:240px;border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:center;font-size:15px;font-family:inherit;outline:none;background:var(--surface);color:var(--ink);margin-bottom:14px;}
  .lock-screen .lk-btn{width:100%;max-width:240px;background:var(--accent);color:var(--surface);border:none;border-radius:14px;padding:14px;font-size:16px;cursor:pointer;font-family:inherit;}
  .lock-screen .lk-forget{margin-top:14px;font-size:13px;color:var(--ink-soft);cursor:pointer;background:none;border:none;}
  /* 底部弹层 */
  .sheet-mask{position:absolute;inset:0;background:rgba(0,0,0,.32);opacity:0;pointer-events:none;transition:.25s;z-index:10;}
  .sheet-mask.show{opacity:1;pointer-events:auto;}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:28px 28px 0 0;
    transform:translateY(100%);transition:.3s cubic-bezier(.2,.8,.2,1);padding:18px 18px 28px;z-index:11;
    border-top:1px solid var(--line);max-height:88%;overflow-y:auto;}
  .sheet.show{transform:translateY(0);}
  .sheet::before{content:'';display:block;width:42px;height:4px;border-radius:4px;background:var(--line);margin:-6px auto 14px;}
  .sheet h3{margin:0 0 14px;font-size:19px;font-weight:600;letter-spacing:.3px;}
  .sheet .row{display:flex;align-items:center;gap:14px;margin-bottom:14px;}
  .sheet .big-avatar{width:56px;height:56px;border-radius:50%;background:var(--line-soft);
    display:flex;align-items:center;justify-content:center;color:var(--ink-soft);position:relative;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.06);}
  .sheet .big-avatar svg{width:50%;height:50%;stroke:var(--ink-soft);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;}
  .sheet .big-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;}
  .sheet .edit-badge{position:absolute;right:-2px;bottom:-2px;background:var(--accent);color:#fff;
    width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--surface);}
  .sheet .edit-badge svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .kv{font-size:14px;color:var(--ink-soft);display:flex;align-items:center;gap:6px;}
  .kv b{color:var(--ink);font-weight:600;}
  .kv svg{width:14px;height:14px;stroke:var(--ink-soft);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;}
  .kv-row{background:var(--paper);border-radius:14px;padding:12px 14px;margin:8px 0;}
  .kv-row .kv{margin:0;}
  .sheet-actions{display:flex;gap:10px;margin-top:14px;}
  .sheet-actions button{flex:1;padding:12px 4px;border-radius:16px;border:1px solid var(--line);
    background:var(--paper);color:var(--ink);font-size:14px;cursor:pointer;font-family:inherit;transition:background .2s;display:inline-flex;align-items:center;justify-content:center;gap:5px;}
  .sheet-actions button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;}
  .sheet-actions button:hover{background:var(--line-soft);}
  .sheet-actions .primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  .empty{text-align:center;color:var(--ink-soft);margin:60px auto;max-width:240px;font-size:14px;}
  .empty .em{display:block;margin:0 auto 16px;opacity:.35;}
  .empty .em svg{width:96px;height:96px;stroke:var(--ink-soft);fill:none;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;}
  .empty .ttl{font-size:15px;color:var(--ink);font-weight:500;margin-bottom:6px;}
  .empty .desc{font-size:13px;color:var(--ink-mute);line-height:1.6;}
  .theme-opt{display:flex;gap:10px;margin:8px 0 18px;}
  .theme-opt div{flex:1;text-align:center;padding:14px 0;border:1px solid var(--line);border-radius:18px;cursor:pointer;font-size:14px;}
  .theme-opt div.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);}
  .bk-row{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:14px;cursor:pointer;transition:background .2s;}
  .bk-row:hover{background:var(--line);}
  .bk-row .bi{display:flex;flex:0 0 auto;}
  .bk-row .bi svg{width:20px;height:20px;stroke:var(--accent);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
  .bk-row b{color:var(--ink);font-weight:600;font-size:14px;}
  .bk-row .d{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  /* 主题背景 */
  .bg-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px;}
  .bg-card{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;transition:all .2s;}
  .bg-card:hover{border-color:var(--ink-mute);}
  .bg-card.sel{border-color:var(--accent);background:var(--accent-soft);}
  .bg-card .bg-preview{width:100%;height:72px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);background-size:cover;background-position:center;position:relative;overflow:hidden;}
  .bg-card .bg-preview.bg-custom{background:var(--paper);border:1.5px dashed var(--ink-mute);}
  .bg-card .bg-preview img{width:100%;height:100%;object-fit:cover;}
  .bg-card .bg-name{font-size:12.5px;color:var(--ink);font-weight:500;}
  .bg-card.sel .bg-name{color:var(--accent);font-weight:600;}
  /* 添加表单 */
  .add-input{width:100%;border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;
    font-size:15px;color:var(--ink);font-family:inherit;outline:none;background:var(--surface);margin-bottom:10px;}
  .field-label{font-size:13px;color:var(--ink-soft);margin:6px 2px;}
  .sug-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:16px;
    background:var(--accent);color:#fff;font-size:12px;cursor:pointer;border:none;font-family:inherit;margin-bottom:10px;}
  .reason-box{font-size:12px;color:var(--ink-soft);background:var(--line-soft);
    padding:8px 10px;border-radius:8px;margin:2px 0 4px;line-height:1.6;}
  .storage-pill{display:inline-flex;align-items:center;gap:5px;padding:8px 16px;border-radius:20px;
    border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);font-size:14px;cursor:pointer;font-family:inherit;margin:0 8px 8px 0;transition:all .2s;}
  .storage-pill.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600;}
  .tag-wrap{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .tag-pill{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:16px;
    background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600;}
</style>
</head>
<body>
<div class="phone">
  <div class="tophead">
    <div class="top-left">
      <div><div class="hand-title">时叙</div></div>
    </div>
    <div style="display:flex;gap:4px">
      <button class="icon-btn" id="searchBtn" title="搜索">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M16 16l5 5"/></svg>
      </button>
      <button class="icon-btn" id="menuBtn" title="更多">
        <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="19" cy="12" r="1.4" fill="currentColor"/></svg>
      </button>
    </div>
  </div>
  <div class="dropdown" id="topMenu">
    <button data-act="view">▦ 切换列表/网格</button>
    <div class="sep"></div>
    <button data-act="sort" data-v="expiring">即将到期优先 <span class="ck" data-ck="expiring">✓</span></button>
    <button data-act="sort" data-v="far">较远到期优先 <span class="ck" data-ck="far">✓</span></button>
    <button data-act="sort" data-v="name">按名称 <span class="ck" data-ck="name">✓</span></button>
    <button data-act="sort" data-v="stock">余量从少到多 <span class="ck" data-ck="stock">✓</span></button>
    <div class="sep"></div>
    <button data-act="theme">🌙 深浅色切换</button>
  </div>
  <div id="chips" class="chips"></div>
  <div id="search" class="search" style="display:none">
    <svg viewBox="0 0 24 24" width="18" height="18" style="stroke:var(--ink-mute);fill:none;stroke-width:1.6;stroke-linecap:round"><circle cx="11" cy="11" r="6"/><path d="M16 16l5 5"/></svg>
    <input id="searchInput" placeholder="搜索物品名称 / 备注" />
  </div>
  <div id="content" class="content"></div>
  <div class="nav" id="nav">
    <button data-tab="items" class="nav-btn active">
      <svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4"/><path d="M12 11v10"/></svg>物品
    </button>
    <button data-tab="remind" class="nav-btn">
      <svg viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 4 1.5 5 1.5 5H4.5S6 13 6 9z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>提醒
    </button>
    <button class="nav-add" id="navAdd" title="添加">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button data-tab="shop" class="nav-btn">
      <svg viewBox="0 0 24 24"><path d="M3 4h2l2.6 11.4a2 2 0 0 0 2 1.6h8a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>补货
    </button>
    <button data-tab="me" class="nav-btn">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.4-4.6 4.6-7 8-7s6.6 2.4 8 7"/></svg>我的
    </button>
  </div>

  <!-- 详情弹层 -->
  <div class="sheet-mask" id="mask"></div>
  <div class="sheet" id="sheet">
    <div class="row">
      <div class="big-avatar" id="sheetAvatar"></div>
      <div>
        <h3 id="sheetName" style="margin:0 0 4px"></h3>
        <div id="sheetBadge"></div>
      </div>
    </div>
    <div id="sheetTags" class="tag-wrap"></div>
    <div id="sheetKv"></div>
    <div class="sheet-actions">
      <button id="editBtn"><svg viewBox="0 0 24 24"><path d="M14 4l6 6-9 9H5v-6z"/></svg>编辑</button>
      <button id="handleBtn"><svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg>已处理</button>
      <button id="delBtn" style="color:var(--red)"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>删除</button>
    </div>
  </div>
  <!-- 添加表单弹层 -->
  <div class="sheet" id="addSheet">
    <h3 style="margin:2px 0 12px">添加物品</h3>
    <div class="field-label">物品名称</div>
    <input id="addName" class="add-input" placeholder="例如：布洛芬片、纯牛奶" />
    <div id="addSuggestion"></div>
    <div class="field-label">分类</div>
    <div id="addCats" class="chips" style="padding:0 0 4px"></div>
    <div class="field-label">生产日期（自己选择，不默认）</div>
    <input id="addProd" type="date" class="add-input" />
    <div class="field-label">过期日期（自己选择）</div>
    <input id="addExpiry" type="date" class="add-input" />
    <div class="field-label">存放位置</div>
    <div id="addStorage"></div>
    <div id="addFreshBox" style="display:none">
      <div class="field-label">保鲜期（开封后天数）</div>
      <input id="addFresh" class="add-input" type="number" min="1" placeholder="如：冷藏牛奶开封后 7 天" />
      <div class="reason-box">冰箱食物请在保鲜期内尽快食用，防止变质影响安全。</div>
    </div>
    <div class="field-label">当前余量（%）</div>
    <input id="addQty" class="add-input" type="number" min="0" max="100" placeholder="0-100" />
    <div class="field-label">预警阈值（%）</div>
    <input id="addTh" class="add-input" type="number" min="0" max="100" placeholder="低于此值提醒" />
    <div class="field-label">备注</div>
    <textarea id="addNote" class="add-input" rows="2" placeholder="添加备注信息..." style="resize:none"></textarea>
    <div class="sheet-actions" style="margin-top:14px">
      <button id="addCancel">取消</button>
      <button id="addSave" class="primary">保存</button>
    </div>
  </div>

  <!-- 锁屏 -->
  <div class="lock-screen" id="lockScreen">
    <div class="lk-avatar" id="lkAvatar"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="3.6"/><path d="M5 20c1.2-4 4-6 7-6s5.8 2 7 6"/></svg></div>
    <h3>效期管家</h3>
    <div class="hint2">已开启密码锁，请输入密码解锁</div>
    <input type="password" id="lkPwd" placeholder="请输入密码" />
    <button class="lk-btn" id="lkUnlock">解锁</button>
    <button class="lk-forget" id="lkForget">忘记密码？清除锁</button>
  </div>
  <input type="file" id="avatarFile" accept="image/*" style="display:none" />

  <!-- 子页面弹层 -->
  <div class="subpage-mask" id="subMask"></div>
  <div class="subpage" id="subpage"></div>
</div>

<script>
const CATS = ['全部','日用品','药品','食品','护肤','证件'];
const CAT_ICON = {'日用品':'🧴','药品':'💊','食品':'🍞','护肤':'🌿','证件':'🪪'};
const STORAGE_ICON = {'常温':'🏠','冷藏':'🥶','冷冻':'🧊'};
let items = [
  {id:1,name:'纯牛奶',cat:'食品',days:2,status:'orange',qty:60,th:30,prod:'2026-08-01',expiry:'2026-08-18',storage:'冷藏',fresh:7,note:'早餐用',avatar:''},
  {id:2,name:'布洛芬',cat:'药品',days:-1,status:'red',qty:80,th:20,prod:'2024-06-15',expiry:'2026-08-15',storage:'常温',fresh:0,note:'退烧',avatar:''},
  {id:3,name:'身份证',cat:'证件',days:400,status:'gray',handled:true,qty:100,th:50,prod:'2020-01-01',expiry:'2030-01-01',storage:'常温',fresh:0,note:'随身',avatar:''},
  {id:4,name:'洗面奶',cat:'护肤',days:60,status:'green',qty:70,th:20,prod:'2026-06-15',expiry:'2026-10-15',storage:'常温',fresh:0,note:'',avatar:''},
  {id:5,name:'冻鸡胸肉',cat:'食品',days:200,status:'green',qty:90,th:20,prod:'2026-01-01',expiry:'2027-01-01',storage:'冷冻',fresh:180,note:'分装',avatar:''},
  {id:6,name:'维生素C',cat:'药品',days:5,status:'orange',qty:40,th:20,prod:'2026-02-01',expiry:'2026-08-21',storage:'常温',fresh:0,note:'每日',avatar:''},
  {id:7,name:'冷藏酸奶',cat:'食品',days:10,status:'green',qty:50,th:20,prod:'2026-08-10',expiry:'2026-08-26',storage:'冷藏',fresh:3,note:'开封后 3 天',avatar:''},
];
let state = {tab:'items',cat:'全部',view:'list',dark:false,sel:null,query:'',sort:'expiring',accent:'#4A5568',
  accPhone:'',accNick:'',hasPwd:false,pwd:'',lock:false,accAvatar:'',
  notif:{enabled:true,days:[7,3,1,0],push:true,sound:true,vibrate:true,dnd:false,dndStart:'22:00',dndEnd:'08:00'},
  bgTheme:'cream', bgCustom:''};
let addCat='日用品', addManual=false, addSuggested=null, addEditId=null, addStorage='常温';

const $ = s=>document.querySelector(s);
function openSubpage(kind){
  const sp=$('#subpage'), sm=$('#subMask');
  let html='';
  if(kind==='account'){
    const av=state.accAvatar?`<img src="${state.accAvatar}">`:`<svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="3.6"/><path d="M5 20c1.2-4 4-6 7-6s5.8 2 7 6"/></svg>`;
    html=`<h3><span>账号设置</span><button class="back" id="subBack">关闭</button></h3>
      <div class="center">
        <div class="big-avatar" id="subAvatar">${av}</div>
        <button class="btn-blue" id="subChangeAv">更换头像</button>
        <div style="font-size:12px;color:var(--ink-soft);margin-top:6px">拍照 / 相册 / 移除</div>
      </div>
      <div class="label">昵称（≤20 字，实时保存）</div>
      <div class="field-row"><div class="ic"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h10M4 17h16"/></svg></div><input id="subNick" maxlength="20" placeholder="请输入昵称" value="${state.accNick||''}"></div>
      <div class="label">手机号（11 位 + 4 位验证码）</div>
      <div class="field-row"><div class="ic"><svg viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/></svg></div><input id="subPhone" maxlength="11" placeholder="新手机号" value="${state.accPhone||''}"><button class="pill" id="subGetCode">获取验证码</button></div>
      <div class="field-row"><div class="ic"><svg viewBox="0 0 24 24"><circle cx="9" cy="9" r="3"/><path d="M14 10l7 7"/></svg></div><input id="subCode" maxlength="4" placeholder="4 位验证码"></div>
      <div class="label">密码（6-20 位，含字母与数字）</div>
      <div class="field-row"><div class="ic"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div><input id="subPwd" type="password" placeholder="新密码"></div>
      <div class="field-row"><div class="ic"><svg viewBox="0 0 24 24"><path d="M5 12l4 4 10-10"/></svg></div><input id="subPwd2" type="password" placeholder="确认密码"></div>
      <button class="btn-blue" id="subSaveAcc" style="width:100%;margin-top:8px">保存</button>`;
  } else if(kind==='personal'){
    const themes = [
      {id:'cream',name:'奶油暖橙',bg:'linear-gradient(180deg,#FFE2BD 0%,#FFF1DA 45%,#FFFBEF 100%)'},
      {id:'dream',name:'暮紫星空',bg:'linear-gradient(180deg,#D9CDF3 0%,#B5A6D6 35%,#7B6FA1 100%)'},
      {id:'cloud',name:'云朵粉蓝',bg:'linear-gradient(180deg,#D9E8F3 0%,#EAF1F7 40%,#FBF8F5 100%)'},
    ];
    const currentBg = state.bgTheme||'cream';
    const bgCard = (t)=>{
      const sel = currentBg===t.id;
      return `<div class="bg-card ${sel?'sel':''}" data-bg="${t.id}">
        <div class="bg-preview" style="background:${t.bg}">${sel?'<svg viewBox="0 0 24 24" style="stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;width:18px;height:18px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))"><path d="M5 12l5 5L20 7"/></svg>':''}</div>
        <div class="bg-name">${t.name}</div>
      </div>`;
    };
    html=`<h3><span>个性化设置</span><button class="back" id="subBack">关闭</button></h3>
      <div class="label">外观</div>
      <div class="theme-opt" id="subTheme">
        <div data-t="light" class="${!state.dark?'active':''}">☀️ 浅色</div>
        <div data-t="dark" class="${state.dark?'active':''}">🌙 深色</div>
      </div>
      <div class="label">主题背景</div>
      <div class="bg-grid">
        ${themes.map(bgCard).join('')}
        <div class="bg-card ${currentBg==='custom'?'sel':''}" data-bg="custom">
          <div class="bg-preview bg-custom" id="bgCustom">${state.bgCustom?'<img src="'+state.bgCustom+'">':'<svg viewBox="0 0 24 24" style="stroke:var(--ink-soft);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;width:22px;height:22px"><path d="M12 5v14M5 12h14"/></svg>'}</div>
          <div class="bg-name">自定义图片</div>
        </div>
      </div>
      <div style="font-size:12px;color:var(--ink-soft);margin-top:10px;padding:0 4px;line-height:1.6">柔和不刺眼、治愈氛围；也可点击「自定义图片」上传本地背景。</div>
      <input type="file" id="bgCustomFile" accept="image/*" style="display:none">`;
  } else if(kind==='notif'){
    const n=state.notif;
    const icOn  = '<svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg>';
    const icOff = '<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
    const icBell = '<svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2H4.5z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>';
    const icSpeaker = '<svg viewBox="0 0 24 24"><path d="M6 10h3l5-4v12l-5-4H6z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8 8 0 0 1 0 12"/></svg>';
    const icVib = '<svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="18" rx="2"/><path d="M12 7v2M12 11v2M12 15v2"/></svg>';
    const icMoon = '<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
    const icClock = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
    const dayRow=(label,v)=>{
      const sel = n.days.includes(v);
      return `<div class="acc-item ${sel?'on':''}" data-day="${v}"><span class="ic">${sel?icOn:icOff}</span><div class="t">${label}</div></div>`;
    };
    html=`<h3><span>通知设置</span><button class="back" id="subBack">关闭</button></h3>
      <div class="label">通知总开关</div>
      <div class="card" style="padding:0 6px">
        <div class="acc-item" style="border-top:none"><span class="ic">${icBell}</span><div class="t">启用提醒</div><div class="switch ${n.enabled?'on':''}" id="subNotifOn"><div class="knob"></div></div></div>
      </div>
      <div class="label">提醒时间</div>
      <div class="card" style="padding:6px">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
          ${dayRow('提前 7 天',7)}
          ${dayRow('提前 3 天',3)}
          ${dayRow('提前 1 天',1)}
          ${dayRow('到期当天',0)}
        </div>
      </div>
      <div class="label">提醒方式</div>
      <div class="card" style="padding:0 6px">
        <div class="acc-item" data-push style="border-top:none"><span class="ic">${icBell}</span><div class="t">推送通知</div><div class="switch ${n.push?'on':''}" data-tg="push"><div class="knob"></div></div></div>
        <div class="acc-item" data-snd style="border-top:none"><span class="ic">${icSpeaker}</span><div class="t">声音提醒</div><div class="switch ${n.sound?'on':''}" data-tg="sound"><div class="knob"></div></div></div>
        <div class="acc-item" data-vib style="border-top:none"><span class="ic">${icVib}</span><div class="t">震动提醒</div><div class="switch ${n.vibrate?'on':''}" data-tg="vibrate"><div class="knob"></div></div></div>
      </div>
      <div class="label">免打扰时段</div>
      <div class="card" style="padding:0 6px">
        <div class="acc-item" style="border-top:none"><span class="ic">${icMoon}</span><div class="t">开启免打扰</div><div class="switch ${n.dnd?'on':''}" data-tg="dnd"><div class="knob"></div></div></div>
        <div class="acc-item" style="border-top:none"><span class="ic">${icClock}</span><div class="t">开始时间</div><div class="s" style="color:var(--accent)">${n.dndStart}</div></div>
        <div class="acc-item" style="border-top:none"><span class="ic">${icClock}</span><div class="t">结束时间</div><div class="s" style="color:var(--accent)">${n.dndEnd}</div></div>
      </div>
      <div style="height:14px"></div>`;
  } else if(kind==='backup'){
    html=`<h3><span>数据备份</span><button class="back" id="subBack">关闭</button></h3>
      <div class="card" style="padding:6px 10px">
        <div class="bk-row" data-bk="export"><span class="bi"><svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M5 21h14"/></svg></span><div><b>导出并分享备份</b><div class="d">生成 JSON 并通过系统分享保存</div></div></div>
        <div class="bk-row" data-bk="import"><span class="bi"><svg viewBox="0 0 24 24"><path d="M12 21V9"/><path d="M7 16l5 5 5-5"/><path d="M5 3h14"/></svg></span><div><b>导入备份</b><div class="d">从 JSON 文件恢复（覆盖现有数据）</div></div></div>
      </div>
      <div style="font-size:12px;color:var(--ink-soft);margin-top:14px;padding:0 4px;line-height:1.6">建议定期导出 JSON 保存到网盘或电脑；导入会先弹窗确认再覆盖当前数据。</div>`;
  } else if(kind==='about'){
    html=`<h3><span>关于我们</span><button class="back" id="subBack">关闭</button></h3>
      <div class="card" style="padding:18px;text-align:center">
        <div style="font-size:22px;font-weight:600;margin-bottom:6px">效期管家</div>
        <div style="font-size:13px;color:var(--ink-soft);line-height:1.7">版本 1.0.0<br>记录物品有效期与冰箱保鲜期，到期前贴心提醒，防止浪费与变质风险。<br>数据仅保存在本机，不上传任何服务器。</div>
      </div>`;
  }
  sp.innerHTML=html;
  sm.classList.add('show');
  sp.classList.add('show');

function badge(s){const m={green:['b-green','正常'],orange:['b-orange','即将到期'],red:['b-red','已过期'],gray:['b-gray','已处理'],blue:['b-blue','需关注']};const[x,t]=m[s]||m.green;return `<span class="badge ${x}">${t}</span>`;}
function autoCat(name){
  name=(name||'');
  const KW={'药品':['药','片','胶囊','膏','糖浆','口服液','针剂'],'食品':['食','饮料','零食','调味','罐头','饼干','牛奶','酸奶','鸡胸肉','肉','蛋'],'日用品':['纸','清洁','洗衣','洗洁精','垃圾袋','电池'],'护肤':['面霜','乳液','精华','面膜','防晒','洗面奶'],'证件':['身份证','驾驶证','护照','签证','保单','合同']};
  for(const cat in KW){for(const kw of KW[cat]){if(name.includes(kw)) return cat;}}
  return null;
}
function genTags(it){
  const tags=[];
  if((it.qty||0) < (it.th||0)) tags.push('需要购买');
  if((it.days||0) <= 30) tags.push('即将到期');
  if(it.openedDate) tags.push('已开封');
  // 冰箱保鲜
  if(it.storage && it.storage!=='常温' && it.fresh>0){
    const opened = it.opened || it.prod;
    if(opened){
      const exp = new Date(opened); exp.setDate(exp.getDate()+it.fresh);
      const left = Math.round((exp - new Date())/86400000);
      if(left<0) tags.push('已过保鲜期');
      else if(left<=2) tags.push('保鲜临期');
    }
  }
  return tags;
}
function avatarHtml(it){return it.avatar?`<img class="avatar" src="${it.avatar}">`:`<div class="avatar">${CAT_ICON[it.cat]||'📦'}</div>`;}
function effStatus(i){return i.handled?'gray':i.status;}
function statusRank(i){const o={red:0,orange:1,green:2,gray:3};return o[effStatus(i)]??2;}
function effDays(i){return i.handled?Infinity:i.days;}
function filtered(){
  let list = items.slice();
  if(state.tab==='items'){
    if(state.cat!=='全部') list=list.filter(i=>i.cat===state.cat);
    if(state.query) list=list.filter(i=>(i.name+i.cat+(i.note||'')).toLowerCase().includes(state.query.toLowerCase()));
    const s=state.sort;
    if(s==='expiring') list.sort((a,b)=>effDays(a)-effDays(b));
    else if(s==='far') list.sort((a,b)=>effDays(b)-effDays(a));
    else if(s==='name') list.sort((a,b)=>a.name.localeCompare(b.name,'zh'));
    else if(s==='stock') list.sort((a,b)=>a.qty-b.qty);
  } else if(state.tab==='remind'){
    list=list.filter(i=>{
      if(i.handled) return false;
      if(i.status==='orange'||i.status==='red') return true;
      // 保鲜临期 / 超期
      if(i.storage && i.storage!=='常温' && i.fresh>0){
        const opened=i.opened||i.prod;
        if(opened){
          const exp=new Date(opened); exp.setDate(exp.getDate()+i.fresh);
          const left=Math.round((exp-new Date())/86400000);
          if(left<=2) return true;
        }
      }
      return false;
    });
    list.sort((a,b)=>a.days-b.days);
  } else if(state.tab==='shop'){
    list=list.filter(i=>{
      if(i.handled) return false;
      if(i.qty<=i.th || i.days<=7) return true;
      if(i.storage && i.storage!=='常温' && i.fresh>0){
        const opened=i.opened||i.prod;
        if(opened){
          const exp=new Date(opened); exp.setDate(exp.getDate()+i.fresh);
          const left=Math.round((exp-new Date())/86400000);
          if(left<=2) return true;
        }
      }
      return false;
    });
  }
  return list;
}
function freshMeta(it){
  if(!it.storage || it.storage==='常温' || !it.fresh) return null;
  const opened=it.opened||it.prod;
  if(!opened) return null;
  const exp=new Date(opened); exp.setDate(exp.getDate()+it.fresh);
  const left=Math.round((exp-new Date())/86400000);
  return {date: exp.toISOString().slice(0,10), left};
}

function overviewHtml(){
  const total = items.filter(i=>!i.handled).length;
  const exp = items.filter(i=>!i.handled && i.days<=0).length;
  const near = items.filter(i=>!i.handled && i.days>0 && i.days<=7).length;
  const low = items.filter(i=>!i.handled && i.qty<=i.th).length;
  const freshBad = items.filter(i=>{const fm=freshMeta(i);return fm&&fm.left<0;}).length;
  const greeting = (()=>{
    const h=new Date().getHours();
    if(h<6) return '夜深了';
    if(h<11) return '早安';
    if(h<14) return '中午好';
    if(h<18) return '下午好';
    return '晚上好';
  })();
  return `<div class="overview">
    <div class="greet"><h2>${greeting}，主人</h2></div>
    <div class="pill">共 ${total} 件在管 · ${near+freshBad} 临期 · ${low} 告急</div>
    <div class="stats">
      <div class="stat"><div class="num ${exp?'red':'green'}">${exp}</div><div class="lbl">已过期</div></div>
      <div class="stat"><div class="num ${near||freshBad?'orange':'green'}">${near+freshBad}</div><div class="lbl">临期/保鲜</div></div>
      <div class="stat"><div class="num ${low?'orange':'green'}">${low}</div><div class="lbl">库存告急</div></div>
    </div>
  </div>`;
}
function cardHtml(it){
  const st = it.handled?'handled':it.status;
  const sub = it.handled?'已处理':(it.days<0?`已过期 ${-it.days} 天`:`剩余 ${it.days} 天`);
  const fm=freshMeta(it);
  const freshLine = fm ? `<div class="meta" style="margin-top:3px">${(STORAGE_ICON[it.storage]||'')} 保鲜至 ${fm.date}（剩 ${fm.left<0?(-fm.left):fm.left} 天）</div>` : '';
  return `<div class="card ${it.handled?'handled':''}" data-id="${it.id}" data-state="${st}">${avatarHtml(it)}
    <div class="info"><div class="name">${it.name} ${badge(it.handled?'gray':it.status)}</div>
    <div class="meta"><span>${it.cat}</span><span class="dot"></span><span>${sub}</span><span class="dot"></span><span>库存 ${it.qty}%</span></div>

}

$('#sheetAvatar').onclick=()=>{avatarTarget='item';$('#avatarFile').click();};
let avatarTarget='item';
$('#avatarFile').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    if(avatarTarget==='account'){
      state.accAvatar=ev.target.result;
      render();
    } else {
      const it=items.find(i=>i.id===state.sel);
      if(it){it.avatar=ev.target.result;openSheet(it.id);render();}
    }
  };
  r.readAsDataURL(f);
};
// 添加表单
let addCat2='日用品';
function renderAddStorage(){
  $('#addStorage').innerHTML=['常温','冷藏','冷冻'].map(s=>`<button class="storage-pill ${addStorage===s?'active':''}" data-s="${s}">${STORAGE_ICON[s]} ${s}</button>`).join('');
  $('#addStorage').querySelectorAll('.storage-pill').forEach(b=>b.onclick=()=>{
    addStorage=b.dataset.s;
    renderAddStorage();
    $('#addFreshBox').style.display=(addStorage!=='常温')?'block':'none';
  });
}
function openAdd(){
  addCat = state.cat==='全部' ? '日用品' : state.cat;
  addManual=false; addSuggested=null; addEditId=null; addStorage='常温';
  $('#addName').value='';
  $('#addNote').value='';
  $('#addQty').value='';
  $('#addTh').value='';
  $('#addProd').value='';
  $('#addExpiry').value='';
  $('#addFresh').value='';
  $('#addSuggestion').style.display='none';
  $('#addSave').textContent='保存';
  $('#addSheet h3').textContent='添加物品';
  renderAddCats();
  renderAddStorage();
  $('#addFreshBox').style.display='none';
  $('#mask').classList.add('show');$('#addSheet').classList.add('show');
}
function renderAddCats(){
  $('#addCats').innerHTML = ['日用品','药品','食品','护肤','证件'].map(c=>
    `<div class="chip ${addCat===c?'active':''}" data-c="${c}">${CAT_ICON[c]||''} ${c}</div>`).join('');
  $('#addCats').querySelectorAll('.chip').forEach(el=>el.onclick=()=>{addCat=el.dataset.c;renderAddCats();});
}
$('#addName').oninput=async(e)=>{
  const n=e.target.value.trim();
  if(!n){$('#addSuggestion').style.display='none';return;}
  const sug=autoCat(n);
  addSuggested=sug;
  if(!addManual && sug){
    addCat=sug;
    renderAddCats();
  }
  $('#addSuggestion').innerHTML=sug?`<div class="reason-box">智能建议分类：<b>${sug}</b></div>`:'';
  $('#addSuggestion').style.display=sug?'block':'none';
};
$('#addCancel').onclick=closeSheet;
$('#addSave').onclick=()=>{
  const n=$('#addName').value.trim();
  if(!n){$('#addName').focus();return;}
  const prod=$('#addProd').value;
  const expiry=$('#addExpiry').value;
  if(!prod){alert('请选择生产日期');return;}
  if(!expiry){alert('请选择过期日期');return;}
  if(new Date(expiry)<new Date(prod)){alert('过期日期不能早于生产日期');return;}
  const qtyRaw=parseInt($('#addQty').value,10);
  const qty=isNaN(qtyRaw)?'':Math.max(0,Math.min(100,qtyRaw));
  const thRaw=parseInt($('#addTh').value,10);
  const th=isNaN(thRaw)?'':Math.max(0,Math.min(100,thRaw));
  const freshRaw=parseInt($('#addFresh').value,10);
  const fresh=addStorage!=='常温'?(isNaN(freshRaw)?0:freshRaw):0;
  if(addStorage!=='常温' && fresh<=0){alert('冰箱食物请填写保鲜期天数');return;}
  const days=Math.round((new Date(expiry)-new Date())/86400000);
  const note=$('#addNote').value.trim();
  const data={name:n,cat:addCat,days,
    status:days<=0?'red':(days<=7?'orange':'green'),qty,th,prod,expiry,note,avatar:'',
    storage:addStorage,fresh};
  if(addEditId){
    const it=items.find(i=>i.id===addEditId);
    if(it){ Object.assign(it, data); }
  } else {
    items.unshift({id:Date.now(), ...data});
  }
  addEditId=null;
  closeSheet(); render();
};
// 底部导航
$('#nav').querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>{
  $('#nav').querySelectorAll('.nav-btn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); state.tab=b.dataset.tab; state.query=''; render();
});
$('#navAdd').onclick=()=>openAdd();
$('#searchBtn').onclick=()=>{
  const s=$('#search');
  const show = s.style.display==='none';
  s.style.display = show ? 'flex' : 'none';
  if(show) $('#searchInput').focus();
};
$('#menuBtn').onclick=()=>$('#topMenu').classList.toggle('show');
$('#topMenu').onclick=(e)=>{
  const btn=e.target.closest('button'); if(!btn)return;
  const a=btn.dataset.act;
  if(a==='view'){state.view=state.view==='list'?'grid':'list';render();}
  else if(a==='sort'){state.sort=btn.dataset.v;render();}
  else if(a==='theme'){state.dark=!state.dark;render();}
  $('#topMenu').classList.remove('show');
};
// 密码锁屏（预览模拟）
function refreshLockAvatar(){
  const av=$('#lkAvatar');
  av.innerHTML=state.accAvatar?`<img src="${state.accAvatar}">`:'<svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="3.6"/><path d="M5 20c1.2-4 4-6 7-6s5.8 2 7 6"/></svg>';
}
function showLock(){refreshLockAvatar();$('#lockScreen').classList.add('show');$('#lkPwd').value='';}
$('#lkUnlock').onclick=()=>{
  if($('#lkPwd').value===state.pwd){$('#lockScreen').classList.remove('show');}
  else alert('密码错误');
};
$('#lkForget').onclick=()=>{
  if(confirm('忘记密码将清除密码锁（需重新设置密码），是否继续？')){
    state.pwd='';state.hasPwd=false;state.lock=false;
    $('#lockScreen').classList.remove('show');render();alert('已清除密码锁');
  }
};
loadState();
if(state.lock) showLock();
render();
</script>
